<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Registration</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="page">

    <div class="card">

      <h1>🎮 GAME REGISTRATION</h1>

      <p>Register now and join the game!</p>

      <form id="registrationForm">

        <input

          type="text"

          id="fullname"

          placeholder="Full Name"

          required

        >

        <input

          type="text"

          id="playername"

          placeholder="Player Name"

          required

        >

        <input

          type="tel"

          id="mobile"

          placeholder="Mobile Number"

          required

        >

        <input

          type="email"

          id="email"

          placeholder="Email Address"

          required

        >

        <button type="submit">

          REGISTER NOW 🚀

        </button>

      </form>

      <div id="message"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
